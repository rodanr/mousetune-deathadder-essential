[package]
name = "mousetune"
description = "MouseTune for DeathAdder Essential: settings app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mousetune-core = { path = "../crates/mousetune-core" }
mousetune-hid = { path = "../crates/mousetune-hid" }
anyhow = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
png = "0.18"
tempfile = "3"

[features]
# Offscreen rendering for `cargo run --example snapshots --features snapshots`.
snapshots = ["slint/software-renderer-systemfonts"]

[[example]]
name = "snapshots"
required-features = ["snapshots"]

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
