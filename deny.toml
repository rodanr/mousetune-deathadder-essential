# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false

[advisories]
version = 2
# quick-xml 0.38 is pulled in by Slint's Linux accessibility stack
# (accesskit_unix -> zbus_xml, which pins ^0.38). It only parses D-Bus
# introspection XML from the local session bus, a trusted source. Remove these
# once zbus_xml moves to a patched quick-xml.
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml only parses trusted local D-Bus XML via Slint accessibility" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml only parses trusted local D-Bus XML via Slint accessibility" },
]

[licenses]
version = 2
# MouseTune is GPL-3.0-or-later, so GPL-compatible permissive licences are fine.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "0BSD",
  "BSL-1.0",
  "NCSA",
  "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
