[workspace]
resolver = "3"
members = ["crates/mousetune-core", "crates/mousetune-hid", "app", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/rodanr/mousetune-deathadder-essential"
authors = ["MouseTune contributors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
# Smaller downloads: drop debug symbols and optimise across crates.
strip = "symbols"
lto = "thin"
