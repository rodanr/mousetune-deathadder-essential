<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>MouseTune</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252d3a"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
  </defs>
  <!-- App tile (macOS grid: 824 px body inside a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g transform="translate(192 192) scale(2.5)">
    <!-- Dial track -->
    <path d="M60.12 207.88 A96 96 0 1 1 195.88 207.88" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="24" stroke-linecap="round"/>
    <!-- Tuned range, up to the needle -->
    <path d="M60.12 207.88 A96 96 0 0 1 189.71 66.46" fill="none" stroke="#5b9bff" stroke-width="24" stroke-linecap="round"/>
    <!-- Needle: the mouse -->
    <path fill="#f2f4f8" fill-rule="evenodd" transform="rotate(40 128 140)" d="M128 86 a32 32 0 0 1 32 32 v44 a32 32 0 0 1 -64 0 v-44 a32 32 0 0 1 32 -32 Z M123 104 a5 5 0 0 1 10 0 v16 a5 5 0 0 1 -10 0 Z"/>
  </g>
</svg>
