<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>MouseTune</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b38"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#cdd4df"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>

  <!-- Mouse body -->
  <rect x="332" y="170" width="360" height="684" rx="180" fill="url(#body)"/>
  <!-- Button split -->
  <path d="M332 430 H692" stroke="#0d1117" stroke-opacity=".22" stroke-width="12"/>
  <path d="M512 170 V430" stroke="#0d1117" stroke-opacity=".22" stroke-width="12"/>
  <!-- Scroll wheel -->
  <rect x="486" y="250" width="52" height="116" rx="26" fill="#2f6ff0"/>

  <!-- Tuning slider -->
  <rect x="412" y="620" width="200" height="22" rx="11" fill="#0d1117" fill-opacity=".18"/>
  <rect x="412" y="620" width="128" height="22" rx="11" fill="#2f6ff0"/>
  <circle cx="540" cy="631" r="44" fill="#ffffff" stroke="#2f6ff0" stroke-width="14"/>
</svg>
